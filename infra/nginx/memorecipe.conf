# Host-level nginx vhost for MemoRecipe (US-08).
#
# This is a versioned REFERENCE copy of /etc/nginx/sites-available/memorecipe.conf
# on the production VPS. It is NOT deployed automatically: the live copy is edited
# on the server. Keep both in sync whenever either one changes.
#
# Lines marked "managed by Certbot" are written and refreshed by certbot at every
# renewal. Do not hand-edit them, they will be overwritten.
#
# No security headers here on purpose. They are emitted downstream, by the web
# container (App/MemoRecipe.Web/nginx.conf) and by SecurityHeadersMiddleware
# (DEC-021). See DEPLOYMENT.md, section "HTTPS + Let's Encrypt".

server {
    server_name memorecipe.com www.memorecipe.com app.memorecipe.com;

    # US-08 state: static holding page while no container runs.
    # US-14 replaces this block with a proxy to the web container:
    #   location / { proxy_pass http://127.0.0.1:8080; ... }
    root /var/www/memorecipe;
    index index.html;

    http2 on;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/memorecipe.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/memorecipe.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.memorecipe.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.memorecipe.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = memorecipe.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name memorecipe.com www.memorecipe.com app.memorecipe.com;
    return 404; # managed by Certbot
}
