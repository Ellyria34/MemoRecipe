# nginx config for Blazor WASM SPA — serves static files produced by `dotnet publish`

server {
    listen 80;
    server_tokens off;  # OWASP - hide nginx version in Server header + error pages
    server_name _;
    root /usr/share/nginx/html;     # default nginx location, matches Dockerfile COPY
    index index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Reverse proxy /api/* to the API container (Docker compose internal network).
    # Same-origin = no CORS needed in prod. See DEC-028 for the architectural choice.
    location /api/ {
        # Limits & timeouts (structurel)
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Proxy routing (fonctionnel)
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Headers propagés
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: any unknown route falls back to index.html so Blazor client-side
    # router takes over. Without this, F5 on /recipes/abc-123 would return 404.
    location / {
        try_files $uri $uri/ /index.html =404;  
    }

    # Gzip compression — ~60-70% transfert WASM/JS/CSS reduction (++ for SPA Blazor)
    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;


}

