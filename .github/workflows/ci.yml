name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege for all jobs — read repo contents only.
# Individual jobs can override this if they need write access (e.g., future
# build-and-push job on tag v* will need `packages: write` for GHCR).
permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore memoRecipeAppProject/memorecipe-api/memorecipe-api.sln
      - name: Build
        run: dotnet build memoRecipeAppProject/memorecipe-api/memorecipe-api.sln --no-restore
      - name: Test
        run: dotnet test memoRecipeAppProject/memorecipe-api/memorecipe-api.sln --no-build

  test-ia:
    runs-on: ubuntu-latest
    # NOTE: MemoRecipe.IA.Tests is orphan (not referenced in any .sln).
    # Targeting the .csproj directly. When BACK-062 resolves this, switch to
    # `memoRecipe-ia/memorecipe-ia.sln` (which will then contain the tests).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/MemoRecipe.IA.Tests/MemoRecipe.IA.Tests.csproj
      - name: Build
        run: dotnet build tests/MemoRecipe.IA.Tests/MemoRecipe.IA.Tests.csproj --no-restore
      - name: Test (unit only — integration tests requiring Tesseract native libs run locally, see RELEASING.md)
        run: dotnet test tests/MemoRecipe.IA.Tests/MemoRecipe.IA.Tests.csproj --no-build --filter "Category!=Integration"

  build-web:
    runs-on: ubuntu-latest
    # NOTE: MemoRecipe.Web doesn't have tests for the moment, we only restore and build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore App/MemoRecipe.Web/MemoRecipe.Web.csproj
      - name: Build
        run: dotnet build App/MemoRecipe.Web/MemoRecipe.Web.csproj --no-restore

  vuln-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 (for IA solution)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Scan API solution
        run: |
          output=$(dotnet list memoRecipeAppProject/memorecipe-api/memorecipe-api.sln package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -qE '(High|Critical)'; then
            echo "::error::High or Critical vulnerability detected in API solution"
            exit 1
          fi
        
      - name: Scan IA Solution
        run: |
          output=$(dotnet list memoRecipe-ia/memorecipe-ia.sln package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -qE '(High|Critical)'; then
            echo "::error::High or Critical vulnerability detected in IA Solution"
            exit 1
          fi

      - name: Scan Web project
        run: |
          output=$(dotnet list App/MemoRecipe.Web/MemoRecipe.Web.csproj package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -qE '(High|Critical)'; then
            echo "::error::High or Critical vulnerability detected in Web project"
            exit 1
          fi

      - name: Scan tests project
        run: |
          output=$(dotnet list tests/MemoRecipe.IA.Tests/MemoRecipe.IA.Tests.csproj package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -qE '(High|Critical)'; then
            echo "::error::High or Critical vulnerability detected in IA Tests project"
            exit 1
          fi

  lighthouse-a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for @lhci/cli)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Build Web Docker image
        run: docker build -t memorecipe-web:lighthouse-test App/MemoRecipe.Web

      - name: Run Web container (with --add-host to bypass nginx reverse proxy DNS)
        run: docker run --rm -d -p 8080:8080 --add-host=api:127.0.0.1 --name memorecipe-web-lighthouse memorecipe-web:lighthouse-test

      - name: Wait for Web container ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Web is up"
              exit 0
            fi
            echo "Waiting for Web... ($i/30)"
            sleep 2
          done
          echo "::error::Web container not ready after 60s"
          exit 1

      - name: Run Lighthouse audit
        run: lhci autorun

      - name: Stop Web container
        if: always()
        run: docker stop memorecipe-web-lighthouse || true
 
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build E2E test project (generates playwright.ps1 install script)
        run: dotnet build tests/MemoRecipe.Web.E2E.Tests/MemoRecipe.Web.E2E.Tests.csproj

      - name: Install Playwright browsers (chromium + system deps)
        shell: pwsh
        run: tests/MemoRecipe.Web.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Build API container image
        run: |
          dotnet publish memoRecipeAppProject/memorecipe-api/src/MemoRecipe.Api/MemoRecipe.Api.csproj \
            -c Release \
            -t:PublishContainer \
            /p:ContainerImageTag=e2e-local \
            /p:ContainerRegistry=ellyria34

      - name: Start E2E stack (postgres + ia + api + web)
        run: docker compose -f docker-compose.e2e.yml -p memorecipe_e2e up -d

      - name: Wait for stack ready (safety net beyond compose healthchecks)
        run: |
          for i in {1..40}; do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Stack ready"
              exit 0
            fi
            echo "Waiting for stack... ($i/40)"
            sleep 3
          done
          echo "::error::Stack not ready after 120s"
          docker compose -f docker-compose.e2e.yml -p memorecipe_e2e logs
          exit 1

      - name: Run Playwright E2E tests
        run: dotnet test tests/MemoRecipe.Web.E2E.Tests/MemoRecipe.Web.E2E.Tests.csproj --no-build

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml -p memorecipe_e2e logs

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml -p memorecipe_e2e down -v

  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # ONLY on tag push starting with 'v', NOT on regular push/PR
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          dotnet publish memoRecipeAppProject/memorecipe-api/src/MemoRecipe.Api/MemoRecipe.Api.csproj \
            -c Release \
            -t:PublishContainer \
            /p:ContainerImageTag=${{ github.ref_name }}
      
      - name: Compute lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Web image
        run: docker build -t ghcr.io/$OWNER_LC/memorecipe-web:${{ github.ref_name }} App/MemoRecipe.Web

      - name: Push Web image
        run: docker push ghcr.io/$OWNER_LC/memorecipe-web:${{ github.ref_name }}
