# CodeQL static analysis for C# code and GitHub Actions workflows.
# Runs on push/PR to main + weekly schedule to catch newly published CVEs
# affecting code patterns already in the repo.
# See: https://docs.github.com/en/code-security/code-scanning
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '21 10 * * 4'
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Analyze the GitHub Actions workflows themselves (detects insecure
          # patterns like unsafe secret usage, workflow injection, overly broad
          # permissions).
          - language: actions
            build-mode: none
          # Analyze C# source without building (fast, sufficient for most vulns).
          # Switch to 'autobuild' or 'manual' if scan misses code paths only
          # reachable after build.
          - language: csharp
            build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
