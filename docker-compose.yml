services:
  postgres:
    image: postgres:16-alpine
    container_name: memorecipe_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - target: 5432
        published: 5432
        host_ip: 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4
    container_name: memorecipe_pgadmin_dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - target: 8080
        published: 5050
        host_ip: 127.0.0.1
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true

  ia:
    build:
      context: .
      dockerfile: infra/ia-dev/Dockerfile
    container_name: memorecipe_ia_dev
    restart: unless-stopped
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
    ports:
      - target: 7071
        published: 7071
        host_ip: 127.0.0.1
    volumes:
      - ./memoRecipe-ia:/workspace
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: memorecipe-api_postgres_data
