# ============================================================================
# docker-compose.e2e.yml — Ephemeral stack for End-to-End Playwright tests
#
# Differences with docker-compose.prod.yml:
#   - Adds the `ia` service (IA Function local via Fake provider — not Azure)
#   - Uses env_file: .env.e2e instead of Docker Secrets (dummy values)
#   - API built locally (memorecipe-api:e2e-local image generated by
#     scripts/run-e2e-local.ps1 before `docker compose up`)
#   - Web built on the fly from App/MemoRecipe.Web/Dockerfile
#   - Postgres EPHEMERAL (no persistent volume — DB wiped on `down -v`)
#   - OWASP hardening (read_only + cap_drop + tmpfs) SKIPPED intentionally
#     for simplicity (already validated in prod via US-06)
#
# Usage: see scripts/run-e2e-local.ps1
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: memorecipe_postgres_e2e
    env_file: .env.e2e
    # Ephemeral DB: NO persistent volume → wiped on `down -v`
    networks:
      - backend_e2e
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  ia:
    build:
      context: .
      dockerfile: infra/ia-dev/Dockerfile
    container_name: memorecipe_ia_e2e
    env_file: .env.e2e
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
    volumes:
      - ./memoRecipe-ia:/workspace
    networks:
      - backend_e2e
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:7071/ > /dev/null || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    image: ellyria34/memorecipe-api:e2e-local
    container_name: memorecipe_api_e2e
    env_file: .env.e2e
    environment:
      ASPNETCORE_ENVIRONMENT: Testing-NoRateLimit
    networks:
      - backend_e2e
    depends_on:
      postgres:
        condition: service_healthy
      ia:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: App/MemoRecipe.Web
      dockerfile: Dockerfile
    container_name: memorecipe_web_e2e
    ports:
      # ONLY service exposed on host — Playwright tests against http://localhost:8080
      - target: 8080
        published: 8080
        host_ip: 127.0.0.1
    networks:
      - backend_e2e
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  backend_e2e:
    driver: bridge
