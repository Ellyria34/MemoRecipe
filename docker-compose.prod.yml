services:
  postgres:
    image: postgres:16-alpine
    container_name: memorecipe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: '1.0'
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/ellyria34/memorecipe-api:${API_IMAGE_TAG:-latest}
    container_name: memorecipe_api
    restart: unless-stopped
    environment:
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Cors__AllowedOrigins__0: "http://localhost:8080"
      ASPNETCORE_ENVIRONMENT: Production
    secrets:
      - JwtSettings__Secret
      - ConnectionStrings__DefaultConnection
      - OcrScan__BaseUrl
      - Telegram__BotToken
      - Telegram__ChatId
    expose:
      - "8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 512m
    cpus: '1.0'
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/ellyria34/memorecipe-web:${WEB_IMAGE_TAG:-latest}
    container_name: memorecipe_web
    restart: unless-stopped
    ports:
      - target: 80
        published: 8080
        host_ip: 127.0.0.1
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    cpus: '0.5'
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    container_name: memorecipe_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      GPG_RECIPIENT: ${GPG_RECIPIENT}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "30"
    secrets:
      - postgres_password
    volumes:
      - backup_data:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: '0.5'
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local

secrets:
  postgres_password:
    file: ${SECRETS_PATH}/postgres_password
  JwtSettings__Secret:
    file: ${SECRETS_PATH}/JwtSettings__Secret
  ConnectionStrings__DefaultConnection:
    file: ${SECRETS_PATH}/ConnectionStrings__DefaultConnection
  OcrScan__BaseUrl:
    file: ${SECRETS_PATH}/OcrScan__BaseUrl
  Telegram__BotToken:
    file: ${SECRETS_PATH}/Telegram__BotToken
  Telegram__ChatId:
    file: ${SECRETS_PATH}/Telegram__ChatId